<!doctype html>
<html lang="en" class="preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Lector</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M10 7v18h12' stroke='%23fff' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app" data-state="empty">
      <header class="topbar">
        <div class="brand">LECTOR</div>
        <div class="filename" id="filename"></div>
        <div class="topbar-actions">
          <button class="icon-btn doc-only" id="open-file" title="Open another PDF (Ctrl+O)" aria-label="Open another PDF">
            <svg viewBox="0 0 24 24"><path d="M3 7V5h7l2 2h9v12H3V7z" /><path d="M12 11v5M9.5 13.5L12 11l2.5 2.5" /></svg>
          </button>
          <button class="icon-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light or dark mode">
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
          </button>
          <button class="icon-btn" id="settings-open" title="Settings" aria-label="Open settings">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
          </button>
          <button class="icon-btn doc-only" id="close-doc" title="Close PDF" aria-label="Close PDF">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
      </header>

      <main id="scroller" tabindex="-1">
        <div id="pages"></div>
      </main>

      <section id="dropzone" aria-label="Open a PDF">
        <button class="drop-box" id="drop-box" type="button">
          <svg class="drop-icon" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>
          <span class="drop-title" id="drop-title">DROP PDF HERE</span>
          <span class="drop-sub" id="drop-sub">OR CLICK TO BROWSE</span>
          <span class="drop-progress"><span id="drop-bar"></span></span>
        </button>
      </section>

      <div id="drag-overlay"><span>DROP TO OPEN</span></div>

      <nav class="dock doc-only" aria-label="Playback">
        <button class="dock-btn primary" id="play" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" /></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
        </button>
        <button class="dock-btn" id="stop" aria-label="Stop">
          <svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" /></svg>
        </button>
        <span class="dock-sep"></span>
        <button class="dock-readout" id="speed-readout" title="Speed (↑ / ↓)">1.0×</button>
        <span class="dock-sep"></span>
        <span class="dock-readout muted" id="page-readout">PAGE 1 / 1</span>
      </nav>

      <div id="scrim"></div>
      <aside id="settings" aria-label="Settings" aria-hidden="true" tabindex="-1">
        <div class="settings-head">
          <span>SETTINGS</span>
          <button class="icon-btn" id="settings-close" aria-label="Close settings">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>

        <div class="field">
          <div class="field-label"><span>SPEED</span><span id="speed-value">1.0×</span></div>
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" />
          <div class="scale"><span>0.5×</span><span>1.0×</span><span>1.5×</span><span>2.0×</span></div>
        </div>

        <div class="field">
          <div class="field-label"><span>VOICE</span></div>
          <select id="voice"></select>
          <div class="field-note" id="settings-voice-note"></div>
          <button class="text-btn" id="voice-test">PREVIEW VOICE</button>
        </div>

        <div class="field">
          <div class="field-label"><span>THEME</span></div>
          <div class="segmented" id="theme" role="radiogroup">
            <button data-value="system" role="radio">SYSTEM</button>
            <button data-value="light" role="radio">LIGHT</button>
            <button data-value="dark" role="radio">DARK</button>
          </div>
        </div>

        <label class="toggle">
          <span>AUTO-SCROLL</span>
          <input type="checkbox" id="autoscroll" />
          <span class="switch"></span>
        </label>

        <label class="toggle">
          <span>DIM PAGES IN DARK MODE</span>
          <input type="checkbox" id="dimpages" />
          <span class="switch"></span>
        </label>

        <div class="settings-foot">
          <div>SPACE — PLAY / PAUSE</div>
          <div>ESC — STOP</div>
          <div>↑ ↓ — SPEED</div>
          <div>CLICK A SENTENCE — READ FROM THERE</div>
          <div>CTRL / ⌘ + O — OPEN ANOTHER PDF</div>
        </div>
      </aside>

      <div id="toast" role="status"></div>
      <div id="voice-status" role="status"></div>
      <input type="file" id="file-input" accept="application/pdf,.pdf" hidden />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
