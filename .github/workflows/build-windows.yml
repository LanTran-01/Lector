name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run tauri build

      # Smoke test: install silently, check the runtime DLLs sit next to the app, launch it.
      - name: Install and launch check
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Lector'
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'lector.exe','msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Installer is missing $f" }
          }
          $p = Start-Process -FilePath (Join-Path $dir 'lector.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Lector exited right after launch (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Lector installed and started fine."

      # Portable copy: the app plus the runtime DLLs it needs, no installer.
      - name: Make portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/lector.exe portable/Lector.exe
          Copy-Item src-tauri/vcruntime/*.dll portable/

      - uses: actions/upload-artifact@v5
        with:
          name: lector-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - uses: actions/upload-artifact@v5
        with:
          name: lector-windows-portable
          path: portable/
